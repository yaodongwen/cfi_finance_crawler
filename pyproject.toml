[build-system]

requires = [
    "setuptools>=68",
    "wheel",
]

build-backend = "setuptools.build_meta"


[project]

name = "crawl-framework"

version = "0.1.0"

description = "Reusable financial website crawling and storage framework"

requires-python = ">=3.11"

dependencies = [
    "PyYAML>=6.0",
    "pyarrow>=15",
]


[project.optional-dependencies]

postgres = [
    "psycopg[binary]>=3.1",
]

http = [
    "httpx>=0.27",
]

playwright = [
    "playwright>=1.45",
]

dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]


[tool.setuptools]

package-dir = {"" = "src"}


[tool.setuptools.packages.find]

where = ["src"]


[tool.pytest.ini_options]

testpaths = [
    "tests",
]


[tool.ruff]

line-length = 100
